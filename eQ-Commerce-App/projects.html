 60%,#10171D 70%,#0E151B 80%,#101318 90%,#10161a 100%) 0 0/50% 900px no-repeat,linear-gradient(180deg,#161F24 0%,#192229 10%,#1C252C 20%,#1A252B 30%,#1A252B 40%,#182329 50%,#182128 60%,#161D23 70%,#131A20 80%,#0E151B 90%,#10161a 100%) 100% 0/50% 900px no-repeat var(--ground);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.wrap{max-width:none;margin:0 auto;padding-block:5.6px 24px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.glass{background:rgba(30,38,43,.55);border:1px solid var(--line);border-radius:12px;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
/* top bar */
.top{display:flex;align-items:center;gap:14px;min-height:52px}
.logo{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--hi);white-space:nowrap}.logo i{width:18px;height:18px;border:2.5px solid var(--mint);border-radius:50%;border-right-color:transparent}
.crumb{font-size:13px;color:var(--mut);white-space:nowrap}.crumb b{color:var(--hi);font-weight:400}
.nav{display:flex;gap:4px;padding:5px;border-radius:10px;background:rgba(40,50,56,.85);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none;min-width:0}
.nav a{display:flex;align-items:center;gap:7px;padding:0 13px;height:40px;border-radius:7px;font-size:13px;color:var(--mut);text-decoration:none;white-space:nowrap}
.nav a.on{background:#3a454b;color:var(--hi)}.nav a.on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--or)}
.nav em{font-style:normal;font-size:11px;padding:1px 6px;border-radius:4px;background:#1d262b;color:var(--text)}
.tr{margin-left:auto;display:flex;gap:10px;align-items:center}
.srch{display:flex;align-items:center;gap:8px;width:170px;height:44px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:rgba(30,38,43,.6);color:var(--mut)}
.srch input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--hi);font:400 13px var(--body)}
.ai{display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border-radius:9px;border:1px solid var(--cyan2);background:rgba(143,220,242,.08);color:var(--hi);font-size:14px;box-shadow:0 0 18px rgba(111,216,236,.25);white-space:nowrap}
.sq{position:relative;width:44px;height:44px;border-radius:9px;border:1px solid var(--line);background:rgba(30,38,43,.6);display:grid;place-items:center;font:700 12px var(--body);color:var(--hi);flex:none}
.sq b{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--or);color:#fff;font-size:10px;display:grid;place-items:center;border:2px solid #161e22}
/* header */
.hd{display:flex;align-items:flex-end;gap:16px;margin-top:28px;flex-wrap:wrap}
.hd h1{margin:0;font:700 28px var(--display);color:var(--hi);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.live{font:700 11px var(--body);padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:rgba(30,38,43,.7);color:var(--mint);display:flex;gap:8px;align-items:center}.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mint)}
.hd p{margin:8px 0 0;font-size:14px;color:var(--mut);text-shadow:0 1px 10px rgba(8,12,14,.9),0 0 2px rgba(8,12,14,.8)}.hd p b{color:var(--hi)}.r{color:var(--red);font-weight:700}.m{color:var(--mint)}
.tcol{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.upd{display:flex;align-items:center;gap:14px;font-size:14px}.upd>span{display:flex;align-items:center;gap:8px}.upd i{width:7px;height:7px;border-radius:50%;background:#3fa37a}
.ivt{display:flex;gap:4px;padding:4px;border-radius:9px;border:1px solid var(--line);background:rgba(30,38,43,.6)}.ivt span{width:34px;height:30px;border-radius:6px;display:grid;place-items:center}.ivt .on{background:#33474a;color:var(--mint)}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:rgba(30,38,43,.6);font-size:13px;white-space:nowrap}
.pill select{background:none;border:0;color:var(--text);font:inherit;outline:0}
.pill select option{background:#1d262b}
.go{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:40px;padding:0 14px;border-radius:8px;border:1px solid rgba(143,230,195,.6);background:rgba(143,230,195,.12);color:var(--mint);font-weight:700;font-size:13px;white-space:nowrap}
.go:hover{background:rgba(143,230,195,.2)}.go:disabled{opacity:.4;cursor:not-allowed}
.cta{display:inline-flex;align-items:center;justify-content:space-between;gap:12px;height:40px;padding:0 14px;border-radius:8px;border:1px solid rgba(255,122,61,.65);background:rgba(240,131,78,.14);color:var(--cta);font-weight:700;font-size:13.5px;white-space:nowrap;transition:background .2s}
.cta:hover{background:rgba(240,131,78,.24)}
.cta.strong{background:#f0834e;border-color:#f0834e;color:#1f0f06}.cta.strong:hover{background:#f39463}
.go.row{justify-content:space-between;width:100%;height:40px;font-size:13.5px}
.actc{display:flex;flex-direction:column;gap:5px;align-items:stretch}.actc>button{width:100%}.actc small{font-size:11px;color:var(--faint);text-align:center;white-space:nowrap}
.fa .go{flex:1;width:auto;margin-top:0}
.gh{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:rgba(20,27,31,.6);font-size:13.5px;white-space:nowrap}.gh:hover{border-color:#6c7a81}
/* strip */
.strip{display:flex;margin-top:22px;min-height:190px}
.sl{width:260px;flex:none;padding:20px 22px;border-right:1px solid var(--line2)}
.ttl{display:flex;gap:10px;align-items:center;font:700 16px var(--display);color:var(--hi)}
.sqi{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:rgba(20,27,31,.7);display:grid;place-items:center;color:var(--mut);flex:none}
.big{display:flex;align-items:center;gap:16px;margin-top:12px}.big b{font:700 58px/1 var(--display);color:var(--hi)}.big small{display:block;font-size:14px;color:var(--mut);margin-bottom:8px}
.up{display:inline-flex;padding:5px 10px;border-radius:6px;background:rgba(242,116,89,.16);color:var(--red);font:700 13px var(--body)}
.up.ok{background:rgba(143,230,195,.14);color:var(--mint)}
.gb{display:flex;gap:18px;margin-top:14px}.gb div{font:700 14px var(--body);color:var(--hi)}.gb small{display:block;font:400 11px var(--body);color:var(--faint);margin-top:3px;letter-spacing:.06em}
.gb i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:7px;vertical-align:middle;background:var(--c)}
.sr{flex:1;min-width:0;padding:20px 28px;overflow-x:auto}
.sr .h{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}.sr h2{margin:0;font:700 16px var(--display);color:var(--hi)}.sr .h span{font-size:12.5px;color:var(--mut)}
.road{position:relative;height:104px;margin-top:22px;min-width:760px}
.road .ln{position:absolute;left:0;right:0;top:28px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--teal),var(--cyan2));box-shadow:0 0 12px rgba(111,216,236,.55)}
.gp{position:absolute;top:0;width:220px;margin-left:-110px;display:flex;flex-direction:column;align-items:center;border-radius:12px}
.gp .gl{font:700 11px var(--body);letter-spacing:.08em;color:var(--faint)}
.gp .nd{width:16px;height:16px;border-radius:50%;margin-top:8px;background:#1d262b;border:2.5px solid var(--cyan);box-shadow:0 0 12px var(--cyan);transition:transform .3s}
.gp .bx{margin-top:12px;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:rgba(36,45,50,.75);font-size:12px;color:var(--mut);white-space:nowrap;transition:.2s}
.gp em{font-style:normal;color:var(--mint)}
.gp.bad .nd{border-color:var(--or);box-shadow:0 0 14px var(--or)}.gp.bad .bx{border-color:rgba(242,116,89,.6);background:rgba(242,116,89,.1);color:var(--red)}
.gp.done .nd{background:var(--mint);border-color:var(--mint);box-shadow:none}.gp.done .bx{opacity:.6}
.gp.sel .nd{transform:scale(1.4);background:var(--cyan)}.gp.sel.bad .nd{background:var(--or)}.gp.sel .bx{border-color:var(--cyan2);box-shadow:0 0 0 3px rgba(111,216,236,.15)}
.gp.sel.bad .bx{border-color:var(--or);box-shadow:0 0 0 3px rgba(240,131,78,.18)}
/* lower */
.low{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:16px;margin-top:16px;align-items:start}
.lp,.fp{padding:20px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}.ph h2{margin:0;font:700 19px var(--display);color:var(--hi)}
.ps{margin:6px 0 0;font-size:14px;color:var(--mut)}.ps b{color:var(--hi)}
.seg{display:flex;padding:4px;border-radius:9px;border:1px solid var(--line);background:rgba(30,38,43,.6)}.seg button{padding:7px 14px;border-radius:6px;font-size:13px;color:var(--mut)}.seg .on{background:#3a454b;color:var(--hi);font-weight:700}
.chips{display:inline-flex;flex-wrap:wrap;gap:4px;padding:6px;border-radius:9px;background:rgba(20,27,31,.6);border:1px solid var(--line2);margin-bottom:16px}
.chips button{padding:8px 12px;border-radius:6px;font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center}

/* ---------- routing ---------- */
function hashFor(o){o=Object.assign({},S,o);if(!o.plate)return o.page==='orbit'?(o.osel&&o.osel!=='all'?'orbit-'+o.osel:'orbit'):(o.view==='grid'?'grid':'list');
 const p=[o.plate];if(o.page==='orbit')p.push(o.rsel&&o.rsel!=='grade'?'orbit-'+o.rsel:'orbit');else if(o.mode==='full')p.push('full');else if(o.mode==='tab')p.push(o.step===14?'tab':'step-'+o.step);else{if(o.secView==='list')p.push('list');if(o.dept!=='everything')p.push('only-'+o.dept)}
 if(o.panel)p.push(o.panel);return p.join('/')}
function go(o){const h=hashFor(o);if(location.hash.slice(1)===h)route();else location.hash=h}
const PANELS=['grade','test-drive','recond','logistics','money','contracts','counterparties','attachments','add-attachment','obligations','audit'];
function route(){
 const h=decodeURIComponent(location.hash.slice(1)),parts=h.split('/').filter(Boolean);
 const first=(parts[0]||'grid');
 if(first==='list'||first==='grid'){S.plate=null;S.page='page';S.view=first;S.panel=null;render();closeDrawer(true);return}
 if(/^orbit(-|$)/i.test(first)){const k=first.slice(6).toLowerCase(),pp=PR.find(p=>p.id.toLowerCase()===k);S.plate=null;S.page='orbit';S.osel=pp?pp.id:PHASES.some(p=>p.k===k)?k:'all';S.panel=null;render();closeDrawer(true);return}
 const pr=PR.find(p=>p.id.toLowerCase()===first.toLowerCase());
 if(!pr){history.replaceState(null,'','#grid');S.plate=null;S.page='page';S.view='grid';render();closeDrawer(true);return}
 if(pr.id!=='NOT119'){S.plate=null;history.replaceState(null,'','#'+hashFor({}));render();closeDrawer(true);toast(pr.id+' has no full record in this prototype yet · open NOT119');return}
 S.plate=pr.id;S.page='page';S.rsel='grade';S.mode='sections';S.secView='grid';S.dept='everything';S.panel=null;S.step=14;
 parts.slice(1).forEach(p=>{p=p.toLowerCase();
  if(p==='list'||p==='grid')S.secView=p;
  else if(/^orbit(-|$)/.test(p)){S.page='orbit';const k=p.slice(6);if(RS.some(r=>r.slug===k))S.rsel=k}
  else if(p.startsWith('only-')&&DEPTS.some(d=>d[0]===p.slice(5)))S.dept=p.slice(5);
  else if(p==='full')S.mode='full';
  else if(p==='tab'){S.mode='tab';S.step=14}
  else if(/^step-\d+$/.test(p)){const n=+p.slice(5);if(n>=1&&n<=25){S.mode='tab';S.step=n}}
  else if(PANELS.includes(p))S.panel=p});
 render();
 if(S.panel)openDrawer(S.panel);else closeDrawer(true);
}

}

 for(let n=1;n<=25;n++){const g=GATES[n],cls=(n<14?'done':n===14?'now':'')+(g?' gate':'')+(S.mode==='tab'&&S.step===n?' sel':'');
