# Publishes the site to GitHub Pages: the existing static portfolio at the root, unchanged,
# plus the Lamplit book built from lamplit/ and served at /lamplit/.
# Requires Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lamplit/package-lock.json

      - name: Build Lamplit
        working-directory: lamplit
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Assemble site
        run: |
          mkdir _site
          tar --exclude=./.git --exclude=./.github --exclude=./lamplit --exclude=./_site -cf - . | tar -xf - -C _site
          cp -r lamplit/dist _site/lamplit

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
